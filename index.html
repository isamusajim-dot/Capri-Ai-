<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Capri</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05060d;
    color: #e8f9ff;
    font-family: -apple-system, Helvetica, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  header { text-align: center; padding: 14px 0; }
  .orb {
    width: 90px; height: 90px; margin: 0 auto 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff4fd8, #00f0ff 70%);
    box-shadow: 0 0 30px #00f0ff, 0 0 60px #ff4fd855;
    animation: pulse 3s ease-in-out infinite;
  }
  .orb.talking { animation: talk 0.35s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes talk { 50% { transform: scale(1.18); } }
  h1 { font-size: 20px; letter-spacing: 6px; color: #00f0ff; }
  #chat { flex: 1; overflow-y: auto; padding: 8px 0; }
  .msg {
    max-width: 82%; margin: 8px 0; padding: 10px 14px;
    border-radius: 14px; line-height: 1.4; font-size: 16px;
  }
  .capri { background: #0f1a2b; border: 1px solid #00f0ff55; }
  .you { background: #2a0f2b; border: 1px solid #ff4fd855; margin-left: auto; }
  #bar { display: flex; gap: 8px; padding: 10px 0; }
  #input {
    flex: 1; padding: 12px; border-radius: 12px; font-size: 16px;
    background: #0b0f1c; color: #e8f9ff; border: 1px solid #00f0ff55;
  }
  button {
    padding: 12px 16px; border-radius: 12px; font-size: 16px;
    background: #00f0ff; color: #05060d; border: none; font-weight: 700;
  }
  #mic { background: #ff4fd8; }
</style>
</head>
<body>
<header>
  <div class="orb" id="orb"></div>
  <h1>CAPRI</h1>
</header>

<div id="chat"></div>

<div id="bar">
  <button id="mic">🎤</button>
  <input id="input" placeholder="Talk to Capri..." />
  <button id="send">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const orb = document.getElementById('orb');

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.0; u.pitch = 1.1;
  u.onstart = () => orb.classList.add('talking');
  u.onend = () => orb.classList.remove('talking');
  speechSynthesis.speak(u);
}

function capriReply(userText) {
  const lines = [
    "I'm here, choom. What do you need?",
    "Got it. Want me to plan your day?",
    "Say the word and I'll handle it.",
    "Night City never sleeps, and neither do I."
  ];
  return lines[Math.floor(Math.random() * lines.length)];
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'you');
  input.value = '';
  const reply = capriReply(text);
  setTimeout(() => { addMsg(reply, 'capri'); speak(reply); }, 500);
}

document.getElementById('send').onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = 'en-US';
  rec.onresult = e => { input.value = e.results[0][0].transcript; send(); };
  document.getElementById('mic').onclick = () => rec.start();
} else {
  document.getElementById('mic').style.display = 'none';
}

addMsg("Hey Jibril. Capri online.", 'capri');
</script>
</body>
</html>
